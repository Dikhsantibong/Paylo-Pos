<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paylo — Tidak ada koneksi</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #f9fafb;
            --surface: #ffffff;
            --ink: #101828;
            --muted: #475467;
            --border: #eaecf0;
            --brand: #2563eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1220;
                --surface: #111a2b;
                --ink: #f9fafb;
                --muted: #98a2b3;
                --border: #1f2a3c;
                --brand: #528bff;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.08);
        }

        .icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            border-radius: 12px;
            background: color-mix(in srgb, var(--brand) 12%, transparent);
            display: grid;
            place-items: center;
            color: var(--brand);
        }

        h1 { font-size: 20px; line-height: 28px; margin: 0 0 8px; font-weight: 600; }
        p { margin: 0 0 20px; font-size: 14px; line-height: 20px; color: var(--muted); }

        button {
            width: 100%;
            height: 40px;
            border: 0;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover { filter: brightness(0.95); }

        .hint {
            margin: 16px 0 0;
            font-size: 12px;
            line-height: 18px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m2 2 20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="12" x2="12.01" y1="20" y2="20"/>
            </svg>
        </div>

        <h1>Tidak ada koneksi</h1>
        <p>
            Paylo tidak bisa menghubungi server. Transaksi tidak dapat diproses
            sampai koneksi kembali. Periksa jaringan Anda, lalu coba lagi.
        </p>

        <button type="button" onclick="location.reload()">Coba lagi</button>

        <p class="hint">Halaman ini akan memuat ulang otomatis saat koneksi pulih.</p>
    </main>

    <script>
        window.addEventListener('online', function () {
            location.reload();
        });
    </script>
</body>
</html>
